server {
    listen 80;
    server_name _;

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://api:8080;
    }

    location / {
        return 200 "PDF Bot Infra Proxy\n";
        add_header Content-Type text/plain;
    }
}
